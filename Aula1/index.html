<!DOCTYPE html>
    <html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula 01 - css</title>

<style>

    h4.centralizado {
        text-align: center;
        color: crimson;
    }

    * {
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }










</style>

</head>
<body>

    <h1>Introducao ao  CSS</h1>


    <h3 style="font-family: sans-serif; background-color: yellowgreen;">Exemplo simples de css</h3>

    <p style="font-family: monospace;background-color: crimson;">Eu sou um paragrafo</p>

    <hr>

    
    <h3>Exemplo de estilo em um elemento que faz parte de uma classe</h3>


    <h4 class="centralizado">eu sou um h4</h4>

    <p class="centralizado">eu sou um paragrafo</p>

    <hr>

    <h3>Definindo estilos com o seletor global (*)</h3>


    <p>Todos os elementos textuais terao a mesma fonte, inclusive este paragrafo.</p>



    
</body>
</html>
